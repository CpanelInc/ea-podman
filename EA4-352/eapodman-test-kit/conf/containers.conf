# Pinned podman config (plan Phase 1). Every podman call gets CONTAINERS_CONF pointing here.
# setup.sh fills in @RUNTIME@, @RUNTIME_PATH@ and @CONMON_PATH@ from the host's binaries, and
# @LOG_DRIVER@/@EVENTS@ with what the distro's own podman uses (T0.6: 1.x parity).
[containers]
cgroups = "split"
# An empty root-owned file, so the account's ~/.config/containers/mounts.conf adds nothing.
# (setup.sh drops it on podman 3.4, which doesn't know the key and warns on every call.)
default_mounts_file = "/etc/eapodman-test/mounts.conf"
log_driver = "@LOG_DRIVER@"

[engine]
cgroup_manager = "cgroupfs"
@EVENTS@
runtime = "@RUNTIME@"
conmon_path = ["@CONMON_PATH@"]
hooks_dir = []

[engine.runtimes]
@RUNTIME@ = ["@RUNTIME_PATH@"]
