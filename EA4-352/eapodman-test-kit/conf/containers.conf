# Pinned podman config (plan Phase 1). Every podman call gets CONTAINERS_CONF pointing here.
# setup.sh fills in @RUNTIME@, @RUNTIME_PATH@ and @CONMON_PATH@ from the host's binaries.
[containers]
cgroups = "split"
# An empty root-owned file, so the account's ~/.config/containers/mounts.conf adds nothing.
default_mounts_file = "/etc/eapodman-test/mounts.conf"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "journald"
runtime = "@RUNTIME@"
conmon_path = ["@CONMON_PATH@"]
hooks_dir = []

[engine.runtimes]
@RUNTIME@ = ["@RUNTIME_PATH@"]
